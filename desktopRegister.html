<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      color: #111;
      background: #fff;
    }

    button, input, select {
      font: inherit;
    }

    .login-panel {
      margin: 4vw auto;
      max-width: 420px;
    }

    .login-panel input {
      box-sizing: border-box;
      display: block;
      width: 100%;
      margin: 8px 0 16px;
      padding: 8px;
      border: 2px solid #005ab8;
    }

    .app-shell {
      display: none;
      padding: 16px 24px 24px;
    }

    .top-bar {
      margin-bottom: 12px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .toolbar select {
      min-width: 420px;
      max-width: 760px;
      padding: 8px;
      border: 2px solid #005ab8;
      background: #d1e6fa;
    }

    .toolbar input {
      width: 320px;
      padding: 8px;
      border: 2px solid #005ab8;
    }

    .panel {
      display: none;
      margin: 12px 0;
      padding: 12px;
      border: 1px solid #005ab8;
      background: #f7fbff;
    }

    .panel h2 {
      margin: 0 0 10px;
      color: #005ab8;
      font-size: 18px;
    }

    .panel-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .panel input {
      width: 220px;
      padding: 8px;
      border: 2px solid #005ab8;
    }

    .text-button {
      min-height: 40px;
      padding: 8px 12px;
      border: 2px solid #005ab8;
      border-radius: 4px;
      background: #d1e6fa;
      color: #005ab8;
      cursor: pointer;
    }

    .icon-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border: 2px solid #005ab8;
      border-radius: 4px;
      background: #d1e6fa;
      color: #005ab8;
      cursor: pointer;
    }

    .status {
      min-height: 32px;
      font-weight: bold;
      color: #005ab8;
      margin-top: 8px;
      text-align: left;
    }

    .event-title {
      margin: 0 0 12px;
      color: #005ab8;
      font-size: 20px;
      font-weight: bold;
    }

    .table-wrap {
      height: calc(100vh - 150px);
      overflow: auto;
      border: 1px solid #005ab8;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 16px;
    }

    th, td {
      border: 1px solid #005ab8;
      padding: 8px 12px;
    }

    th {
      position: sticky;
      top: 0;
      background: #d1e6fa;
      text-align: left;
      z-index: 1;
    }

    th.action-col, td.action-col {
      width: 96px;
      text-align: center;
    }

    .member-action {
      border: none;
      background: transparent;
      color: #a6a6a6;
      cursor: pointer;
    }

    .member-action.active {
      color: red;
      font-weight: bold;
    }

    .member-action .material-icons {
      font-size: 32px;
    }
  </style>
</head>
<body onload="initDesktopPage()">
  <section id="loginSection" class="login-panel">
    <h1 style="color:#63c369;">Login</h1>
    <label for="login_username">User Name</label>
    <input type="text" id="login_username" placeholder="UserId" name="username">
    <label for="login_password">Password</label>
    <input type="password" id="login_password" name="password" placeholder="password">
    <button id="loginbtn" onclick="login()">Login</button>
    <p id="loginInstructions"></p>
  </section>

  <section id="mainSection" class="app-shell">
    <div class="top-bar">
      <div class="toolbar">
        <select name="events" id="eventsList">
          <?!= getEventListSelectHtml();?>
        </select>
        <button class="icon-button" onclick="updateTable()" title="Reload register">
          <span class="material-icons">cloud_sync</span>
        </button>
        <button class="icon-button" onclick="toggleShowMembers()" title="Show/hide non-attendees">
          <span class="material-icons" id="toggleShowMembersIcon">expand_less</span>
        </button>
        <button class="icon-button" onclick="addGuest()" title="Register a guest">
          <span class="material-icons">person_add</span>
        </button>
        <button class="icon-button" onclick="emailReg()" title="Email register">
          <span class="material-icons">mail</span>
        </button>
        <button class="icon-button" onclick="toggleOpenMode()" title="Switch today/all events">
          <span class="material-icons" id="showTodayIcon">today</span>
        </button>
        <button class="icon-button" onclick="showUpdateOptions()" title="Update options">
          <span class="material-icons">sync</span>
        </button>
        <input type="text" id="showMemberMatches" onkeyup="filterMemberTable()" placeholder="Search members">
        <button class="icon-button" onclick="clearSearch()" title="Clear search">
          <span class="material-icons">backspace</span>
        </button>
      </div>
      <div id="mainInstructions" class="status"></div>
    </div>

    <div id="addGuestSection" class="panel">
      <h2 id="addGuestTitle">Register a guest</h2>
      <div class="panel-row">
        <input type="text" id="guestTitle" placeholder="Title">
        <input type="text" id="guestForename" placeholder="Forename">
        <input type="text" id="guestSurname" placeholder="Surname">
        <input type="text" id="guestPhone" placeholder="Contact number">
        <button class="text-button" onclick="registerGuest()">Register guest</button>
      </div>
    </div>

    <div id="updateMembersSection" class="panel">
      <h2>Update options</h2>
      <div class="panel-row">
        <button class="text-button" onclick="updateTable()">Reload current register from server</button>
        <button class="text-button" onclick="refreshMembers()">Update list with new members</button>
      </div>
      <p id="uploadStatus"></p>
    </div>

    <div id="eventRegisterFor" class="event-title">Please select an event</div>
    <div class="table-wrap">
      <table id="membersTable">
        <thead>
          <tr>
            <th>MNUM</th>
            <th>Name</th>
            <th class="action-col">Register</th>
            <th class="action-col">Check</th>
            <th class="action-col">Zoom</th>
          </tr>
        </thead>
        <tbody id="memberTableBody"></tbody>
      </table>
    </div>
  </section>

  <script>
    var sessionId = null;
    var selectedEventDetails = "";
    var regData = [];
    var numAttendees = 0;
    var filterText = "";
    var hideNonAttendees = false;
    var showAddGuest = false;
    var clearSearchAfterActionTimer;
    const CLEAR_SEARCH_AFTER_ACTION_MS = 4000;

    function loginKeyHandler(e) {
      if (e.key === "Enter") {
        login();
      }
    }

    function initDesktopPage() {
      document.getElementById("login_username").addEventListener("keydown", loginKeyHandler);
      document.getElementById("login_password").addEventListener("keydown", loginKeyHandler);
      document.getElementById("eventsList").addEventListener("change", function() {
        selectedEventDetails = document.getElementById("eventsList").value;
        sessionStorage.selectedEventDetails = selectedEventDetails;
        updateTable();
      });
      if (!localStorage.openWithTodaysEvent) {
        localStorage.openWithTodaysEvent = "allEvents";
      }
      updateTodayToggleIcon();
      applyEventModeToOptions();

      if (sessionStorage.sessionId) {
        sessionId = sessionStorage.sessionId;
        showMainSection();
      }
    }

    function login() {
      const username = document.getElementById("login_username").value;
      const password = document.getElementById("login_password").value;
      const loginInstructions = document.getElementById("loginInstructions");
      loginInstructions.innerHTML = "starting check";

      if (username.length === 0 || password.length === 0) {
        loginInstructions.innerHTML = "you must supply both a username and password";
        return;
      }

      google.script.run.withSuccessHandler(responseHandlerCheckUserGetSessionId)
        .checkUserGetSessionId(username, password, window.innerWidth, window.innerHeight);
    }

    function responseHandlerCheckUserGetSessionId(response) {
      if (!response.valid) {
        document.getElementById("loginInstructions").innerHTML = "Invalid username or password, please try again";
        return;
      }

      sessionStorage.sessionId = response.sessionId.toString();
      sessionStorage.userName = response.userName;
      sessionId = sessionStorage.sessionId;
      showMainSection();
    }

    function showMainSection() {
      document.getElementById("loginSection").style.display = "none";
      document.getElementById("mainSection").style.display = "block";
      if (sessionStorage.selectedEventDetails) {
        selectedEventDetails = sessionStorage.selectedEventDetails;
        document.getElementById("eventsList").value = selectedEventDetails;
        updateTable();
      }
    }

    function loadRegisterWithStatus(message) {
      const eventCode = selectedEventDetails ? selectedEventDetails.slice(0, selectedEventDetails.indexOf(",")) : "";
      if (!eventCode) {
        return;
      }
      const data = [sessionId, eventCode];
      google.script.run.withSuccessHandler(function(response) {
        makeTable(response);
        if (message) {
          setStatus(message);
        }
      }).getRegisteredMembersData(JSON.stringify(data));
    }

    function updateTable() {
      selectedEventDetails = document.getElementById("eventsList").value;
      if (!selectedEventDetails) {
        setStatus("No event specified, please select an event", true);
        return;
      }

      setStatus("Getting the register from the server");
      const data = [sessionId, selectedEventDetails.slice(0, selectedEventDetails.indexOf(","))];
      google.script.run.withSuccessHandler(makeTable).getRegisteredMembersData(JSON.stringify(data));
    }

    function makeTable(response) {
      if (response.sessionIdOk !== "validSessionId") {
        setStatus("Session expired or event unavailable. Please refresh and log in again.", true);
        return;
      }

      regData = [];
      numAttendees = 0;
      selectedEventDetails = document.getElementById("eventsList").value;
      sessionStorage.selectedEventDetails = selectedEventDetails;

      const tbody = document.getElementById("memberTableBody");
      tbody.innerHTML = "";

      response.memberRegister.forEach(function(row, index) {
        const rowId = "desktop_row_" + index.toString().padStart(4, "0");
        const thisReg = {
          eventCode: response.eventCode,
          sessionId: sessionId,
          mnum: row[0],
          memberTitle: row[1],
          memberForename: row[3],
          memberSurname: row[4],
          memberRegistered: row[5],
          memberChecked: row[6],
          memberZoomed: row[7],
          rowId: rowId
        };

        if (thisReg.memberRegistered) {
          numAttendees++;
        }
        regData.push([thisReg.mnum.toString(), thisReg.memberRegistered, thisReg.memberChecked, thisReg.memberZoomed]);

        const tr = document.createElement("tr");
        tr.id = rowId;
        tr.innerHTML = `
          <td>${formatMnum(thisReg.mnum)}</td>
          <td>${escapeHtml([thisReg.memberTitle, thisReg.memberForename, thisReg.memberSurname].join(" "))}</td>
          <td class="action-col">${actionButtonHtml(thisReg, "register")}</td>
          <td class="action-col">${actionButtonHtml(thisReg, "check")}</td>
          <td class="action-col">${actionButtonHtml(thisReg, "zoom")}</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById("eventRegisterFor").innerHTML = selectedEventDetails + ", " + numAttendees + " in person";
      setStatus("Register loaded / synchronised");
      filterMemberTable();
    }

    function actionButtonHtml(data, actionType) {
      let action;
      let active;
      let icon;

      if (actionType === "register") {
        action = data.memberRegistered ? "deregister" : "register";
        active = data.memberRegistered;
        icon = active ? "how_to_reg" : "psychology_alt";
      } else if (actionType === "check") {
        action = data.memberChecked ? "uncheck" : "check";
        active = data.memberChecked;
        icon = active ? "how_to_reg" : "psychology_alt";
      } else {
        action = data.memberZoomed ? "dezoom" : "zoom";
        active = data.memberZoomed;
        icon = active ? "videocam" : "psychology_alt";
      }

      const actionData = Object.assign({}, data, { action: action });
      return `<button class="member-action ${active ? "active" : ""}" data-member-action="${encodeMemberAction(actionData)}">
        <span class="material-icons">${icon}</span>
      </button>`;
    }

    document.addEventListener("click", function(event) {
      const button = event.target.closest("[data-member-action]");
      if (!button) {
        return;
      }
      manageMemberFor(decodeMemberAction(button.dataset.memberAction));
    });

    function manageMemberFor(data) {
      const currentStatus = getStatus(data.mnum.toString());
      const memberName = [data.memberTitle, data.memberForename, data.memberSurname].join(" ");

      if (!currentStatus) {
        setStatus("Could not find current status for " + memberName, true);
        return;
      }

      data.memberRegistered = currentStatus[1];
      data.memberChecked = currentStatus[2];
      data.memberZoomed = currentStatus[3];

      if (data.action === "register" && data.memberZoomed) {
        setStatus("Already registered as Zoom attendee", true);
        return;
      }
      if (data.action === "deregister" && data.memberChecked) {
        setStatus("Uncheck member then retry", true);
        return;
      }
      if (data.action === "check" && !data.memberRegistered) {
        setStatus("Not registered as present In Person so cannot be checked", true);
        return;
      }
      if ((data.action === "check" || data.action === "uncheck") && data.memberZoomed) {
        setStatus("Member is zoomed", true);
        return;
      }
      if (data.action === "zoom" && data.memberRegistered) {
        setStatus("Already registered as In Person attendee", true);
        return;
      }

      if (data.action === "register") {
        data.memberRegistered = true;
      } else if (data.action === "deregister") {
        data.memberRegistered = false;
      } else if (data.action === "check") {
        data.memberChecked = true;
      } else if (data.action === "uncheck") {
        data.memberChecked = false;
      } else if (data.action === "zoom") {
        data.memberZoomed = true;
      } else if (data.action === "dezoom") {
        data.memberZoomed = false;
      }

      setStatus("Updating " + memberName);
      updateLocalStatus(data);
      updateRow(data);
      google.script.run.withSuccessHandler(nextReg).manageMemberFor(data);
    }

    function nextReg(response) {
      setStatus(response.status);
      filterText = document.getElementById("showMemberMatches").value;
      numAttendees = response.numAttendees;
      document.getElementById("eventRegisterFor").innerHTML = selectedEventDetails + ", " + numAttendees + " in person";
      clearTimeout(clearSearchAfterActionTimer);
      clearSearchAfterActionTimer = setTimeout(function() {
        if (document.getElementById("showMemberMatches").value === filterText) {
          clearSearch();
        }
      }, CLEAR_SEARCH_AFTER_ACTION_MS);
    }

    function updateLocalStatus(data) {
      for (var i = 0; i < regData.length; i++) {
        if (regData[i][0].toString() === data.mnum.toString()) {
          regData[i][1] = data.memberRegistered;
          regData[i][2] = data.memberChecked;
          regData[i][3] = data.memberZoomed;
          return;
        }
      }
    }

    function updateRow(data) {
      const row = document.getElementById(data.rowId);
      if (!row) {
        return;
      }
      row.children[2].innerHTML = actionButtonHtml(data, "register");
      row.children[3].innerHTML = actionButtonHtml(data, "check");
      row.children[4].innerHTML = actionButtonHtml(data, "zoom");
    }

    function filterMemberTable() {
      const filter = document.getElementById("showMemberMatches").value.toUpperCase();
      const rows = document.querySelectorAll("#memberTableBody tr");
      rows.forEach(function(row, index) {
        const matchesSearch = row.innerText.toUpperCase().indexOf(filter) > -1;
        const memberStatus = regData[index];
        const isAttending = memberStatus && (memberStatus[1] || memberStatus[2] || memberStatus[3]);
        const matchesAttendance = !hideNonAttendees || isAttending;
        row.style.display = matchesSearch && matchesAttendance ? "" : "none";
      });
    }

    function clearSearch() {
      document.getElementById("showMemberMatches").value = "";
      filterMemberTable();
    }

    function toggleShowMembers() {
      const iconElement = document.getElementById("toggleShowMembersIcon");
      hideNonAttendees = !hideNonAttendees;
      iconElement.innerHTML = hideNonAttendees ? "expand_more" : "expand_less";
      filterMemberTable();
    }

    function addGuest() {
      if (!selectedEventDetails) {
        setStatus("Please select an event before adding a guest", true);
        return;
      }
      showAddGuest = !showAddGuest;
      document.getElementById("addGuestSection").style.display = showAddGuest ? "block" : "none";
    }

    function registerGuest() {
      const guestTitle = document.getElementById("guestTitle").value;
      const guestForename = document.getElementById("guestForename").value;
      const guestSurname = document.getElementById("guestSurname").value;
      const guestPhone = document.getElementById("guestPhone").value;
      const eventCode = selectedEventDetails ? selectedEventDetails.slice(0, selectedEventDetails.indexOf(",")) : "";

      if (!eventCode) {
        setStatus("Please select an event before registering a guest", true);
        return;
      }

      if (!guestTitle || !guestForename || !guestSurname || !guestPhone) {
        document.getElementById("addGuestTitle").innerHTML = "You must complete all fields";
        return;
      }

      setStatus("Registering guest");
      google.script.run.withSuccessHandler(addGuestSuccessHandler)
        .addGuest(guestTitle, guestForename, guestSurname, guestPhone, eventCode);
    }

    function addGuestSuccessHandler(response) {
      document.getElementById("guestTitle").value = "";
      document.getElementById("guestForename").value = "";
      document.getElementById("guestSurname").value = "";
      document.getElementById("guestPhone").value = "";
      document.getElementById("addGuestTitle").innerHTML = "Register a guest";
      showAddGuest = true;
      addGuest();
      loadRegisterWithStatus([response.title, response.forename, response.surname].join(" ") + " has been added to the register");
    }

    function emailReg() {
      if (!selectedEventDetails) {
        setStatus("No event selected, please select an event and try again", true);
        return;
      }
      setStatus("Request sent to email register to committee members - please wait for a response");
      google.script.run.withSuccessHandler(responseHandlerEmailReg).emailRegisterFor(selectedEventDetails);
    }

    function responseHandlerEmailReg(response) {
      setStatus(response);
    }

    function showUpdateOptions() {
      const updateMembersSection = document.getElementById("updateMembersSection");
      updateMembersSection.style.display = updateMembersSection.style.display === "block" ? "none" : "block";
    }

    function refreshMembers() {
      const eventData = document.getElementById("eventsList").value;
      const eventCode = eventData ? eventData.slice(0, eventData.indexOf(",")) : "";
      if (!eventCode) {
        setStatus("No event selected - select an event, then retry update members", true);
        return;
      }
      if (!confirm("This will update the register for " + eventData + " to include any new members downloaded from Beacon. Do you want to continue?")) {
        return;
      }
      document.getElementById("uploadStatus").innerHTML = "Updating members...";
      google.script.run.withSuccessHandler(refreshMembersHandler).updateMembersInThisRegister(eventCode);
    }

    function refreshMembersHandler(response) {
      document.getElementById("uploadStatus").innerHTML = escapeHtml(response.msg || "");
      response.sessionIdOk = "validSessionId";
      response.sessionId = sessionId;
      if (response.updated) {
        makeTable(response);
      }
    }

    function toggleOpenMode() {
      localStorage.openWithTodaysEvent = localStorage.openWithTodaysEvent === "allEvents" ? "todaysEvents" : "allEvents";
      updateTodayToggleIcon();
      applyEventModeToOptions();
      selectedEventDetails = "";
      sessionStorage.removeItem("selectedEventDetails");
      document.getElementById("eventsList").selectedIndex = 0;
      document.getElementById("memberTableBody").innerHTML = "";
      document.getElementById("eventRegisterFor").innerHTML = "Please select an event";
      setStatus(localStorage.openWithTodaysEvent === "todaysEvents" ? "Today mode selected" : "All events mode selected");
    }

    function applyEventModeToOptions() {
      const showTodayOnly = localStorage.openWithTodaysEvent === "todaysEvents";
      const today = getTodayDateString();
      const options = document.querySelectorAll("#eventsList option");
      options.forEach(function(option) {
        if (!option.value) {
          option.hidden = false;
          return;
        }
        const isToday = option.textContent.indexOf(today) > -1;
        option.hidden = showTodayOnly && !isToday;
      });
    }

    function getTodayDateString() {
      const d = new Date();
      return d.getDate().toString().padStart(2, "0") + "/" +
        (d.getMonth() + 1).toString().padStart(2, "0") + "/" +
        d.getFullYear();
    }

    function updateTodayToggleIcon() {
      const iconElement = document.getElementById("showTodayIcon");
      if (iconElement) {
        iconElement.innerHTML = localStorage.openWithTodaysEvent === "todaysEvents" ? "calendar_month" : "today";
      }
    }

    function getStatus(mnum) {
      return regData.filter(function(row) {
        return row[0].toString() === mnum.toString();
      })[0];
    }

    function encodeMemberAction(data) {
      return encodeURIComponent(JSON.stringify(data));
    }

    function decodeMemberAction(encodedData) {
      return JSON.parse(decodeURIComponent(encodedData));
    }

    function formatMnum(mnum) {
      let value = mnum.toString().padStart(3, "0");
      if (value.length > 4) {
        value = value.slice(0, 4) + "-";
      }
      return value;
    }

    function setStatus(message, isError) {
      const status = document.getElementById("mainInstructions");
      status.innerHTML = escapeHtml(message || "");
      status.style.color = isError ? "red" : "#005ab8";
    }

    function escapeHtml(value) {
      return value.toString()
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
